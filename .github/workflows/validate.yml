name: Validate Product OS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run static validation
        run: |
          chmod +x scripts/validate.sh
          ./scripts/validate.sh

      - name: Run installer tests
        run: |
          # Configure git for tests that create commits
          git config --global user.email "ci@example.com"
          git config --global user.name "CI Runner"
          chmod +x scripts/install.sh scripts/test-install.sh
          ./scripts/test-install.sh

      - name: Run schema migration tests
        run: |
          chmod +x tests/test-schema-migration.sh
          ./tests/test-schema-migration.sh

      - name: Run doc hygiene tests
        run: |
          chmod +x tests/test-doc-hygiene.sh
          ./tests/test-doc-hygiene.sh

      - name: Verify template references
        run: |
          echo "Checking template references..."
          MISSING=0
          for ref in $(grep -roh "templates/[a-z/-]*\.md" docs/ .claude/ README.md 2>/dev/null | sort -u); do
            if [ ! -f "$ref" ]; then
              echo "Missing: $ref"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo "ERROR: $MISSING template references are broken"
            exit 1
          fi
          echo "All template references valid"

      - name: Verify command files exist
        run: |
          echo "Checking commands referenced in README..."
          # Extract commands from README and verify files exist
          COMMANDS=$(grep -oE '/product-os:[a-z-]+' README.md | sort -u)
          MISSING=0
          for cmd in $COMMANDS; do
            # Convert /product-os:foo to product-os-foo.md
            FILENAME=$(echo "$cmd" | sed 's/\/product-os:/product-os-/' | sed 's/$/.md/')
            if [ ! -f ".claude/commands/$FILENAME" ]; then
              echo "Missing command file for $cmd: .claude/commands/$FILENAME"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo "WARNING: $MISSING command files missing (may be aliases)"
          fi
          echo "Command check complete"

      - name: Count verification
        run: |
          echo "Verifying counts..."
          AGENTS=$(ls .claude/agents/*.md 2>/dev/null | wc -l)
          COMMANDS=$(ls .claude/commands/*.md 2>/dev/null | wc -l)
          SKILLS=$(ls .claude/skills/*.md 2>/dev/null | wc -l)
          echo "Agents: $AGENTS"
          echo "Commands: $COMMANDS"
          echo "Skills: $SKILLS"
          
          # Check README claims match
          README_AGENTS=$(grep -oP '\*\*\d+[^*]*agents' README.md | grep -oP '\d+' | head -1)
          if [ "$README_AGENTS" != "$AGENTS" ]; then
            echo "WARNING: README says $README_AGENTS agents but found $AGENTS"
          fi
