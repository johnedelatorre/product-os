# Canonical flow spec: Dashboard Performance (fictional example).
# Source of truth for flows.md. Schema: .claude/skills/user-flows.md
version: "1.0"  # schema version
project: "dashboard-performance"

flows:
  - id: "FLOW-001"
    name: "Open the dashboard"
    type: "user-flow"
    prd_refs: ["REQ-001", "REQ-002", "REQ-003", "REQ-007"]
    personas: ["enterprise-admin", "enterprise-viewer"]
    nodes:
      - id: "start"
        type: "terminal"
        label: "Admin opens Dashboard"
        state: "neutral"
      - id: "skeleton"
        type: "process"
        label: "Layout skeleton shown within 1 s"
        screen_ref: "SCR-001"
        state: "loading"
      - id: "has_source"
        type: "decision"
        label: "Workspace has a data source?"
      - id: "above_fold"
        type: "process"
        label: "Above-the-fold widgets load one by one"
        screen_ref: "SCR-001"
        state: "loading"
      - id: "widget_ok"
        type: "decision"
        label: "Widget responds within 10 s with 50,000 rows or fewer?"
      - id: "interactive"
        type: "process"
        label: "Dashboard interactive"
        screen_ref: "SCR-002"
        state: "success"
      - id: "scroll"
        type: "input"
        label: "User scrolls"
      - id: "lazy"
        type: "process"
        label: "Below-the-fold widgets load within 200 px of the viewport"
        screen_ref: "SCR-002"
        state: "loading"
      - id: "done"
        type: "terminal"
        label: "All widgets show data and Last updated time"
        screen_ref: "SCR-002"
        state: "success"
      - id: "to_flow_002"
        type: "subflow"
        label: "FLOW-002 Widget fails, times out or has no access"
      - id: "to_flow_003"
        type: "subflow"
        label: "FLOW-003 Empty workspace or large dataset"
    edges:
      - from: "start"
        to: "skeleton"
        style: "primary"
      - from: "skeleton"
        to: "has_source"
        style: "primary"
      - from: "has_source"
        to: "above_fold"
        condition: "Yes"
        style: "primary"
      - from: "has_source"
        to: "to_flow_003"
        condition: "No"
      - from: "above_fold"
        to: "widget_ok"
        style: "primary"
      - from: "widget_ok"
        to: "interactive"
        condition: "Yes"
        style: "primary"
      - from: "widget_ok"
        to: "to_flow_002"
        condition: "Error, timeout or 403"
        style: "error"
      - from: "widget_ok"
        to: "to_flow_003"
        condition: "Over 50,000 rows"
      - from: "interactive"
        to: "scroll"
        style: "primary"
      - from: "scroll"
        to: "lazy"
        trigger: "Widget within 200 px of viewport"
        style: "primary"
      - from: "lazy"
        to: "done"
        style: "primary"

  - id: "FLOW-002"
    name: "Widget fails, times out or has no access"
    type: "user-flow"
    prd_refs: ["REQ-004", "REQ-005", "REQ-010"]
    personas: ["enterprise-admin", "enterprise-viewer"]
    nodes:
      - id: "start"
        type: "terminal"
        label: "Widget request in flight"
        screen_ref: "SCR-001"
        state: "loading"
      - id: "kind"
        type: "decision"
        label: "Failure kind?"
      - id: "error_state"
        type: "process"
        label: "Error state: Couldn't load Revenue by region + Retry"
        screen_ref: "SCR-003"
        state: "error"
      - id: "timeout_state"
        type: "process"
        label: "Timeout state: Still loading after 10 s + Retry"
        screen_ref: "SCR-003"
        state: "error"
      - id: "no_access_state"
        type: "process"
        label: "No-access state: You don't have access to Billing + Request access"
        screen_ref: "SCR-003"
        state: "permission"
      - id: "retry"
        type: "input"
        label: "User selects Retry (this widget only)"
      - id: "retry_ok"
        type: "decision"
        label: "Retry succeeds?"
      - id: "widget_shown"
        type: "terminal"
        label: "Widget shows data; rest of dashboard unchanged"
        screen_ref: "SCR-002"
        state: "success"
      - id: "still_down"
        type: "process"
        label: "Still unavailable. Other widgets are fine. + status page link"
        screen_ref: "SCR-003"
        state: "error"
      - id: "continue"
        type: "terminal"
        label: "User continues with the other widgets"
        state: "neutral"
      - id: "request"
        type: "input"
        label: "User selects Request access"
      - id: "requested"
        type: "terminal"
        label: "Request sent to workspace owner; widget shows Requested"
        screen_ref: "SCR-003"
        state: "success"
    edges:
      - from: "start"
        to: "kind"
      - from: "kind"
        to: "error_state"
        condition: "Server error"
        style: "error"
      - from: "kind"
        to: "timeout_state"
        condition: "No response in 10 s"
        style: "error"
      - from: "kind"
        to: "no_access_state"
        condition: "403 no access"
      - from: "error_state"
        to: "retry"
      - from: "timeout_state"
        to: "retry"
      - from: "retry"
        to: "retry_ok"
      - from: "retry_ok"
        to: "widget_shown"
        condition: "Yes"
        style: "primary"
      - from: "retry_ok"
        to: "still_down"
        condition: "No"
        style: "error"
      - from: "still_down"
        to: "continue"
      - from: "no_access_state"
        to: "request"
      - from: "request"
        to: "requested"
        style: "primary"

  - id: "FLOW-003"
    name: "Empty workspace or large dataset"
    type: "user-flow"
    prd_refs: ["REQ-006", "REQ-009"]
    personas: ["enterprise-admin"]
    nodes:
      - id: "start"
        type: "terminal"
        label: "Dashboard loading"
        screen_ref: "SCR-001"
        state: "loading"
      - id: "has_source"
        type: "decision"
        label: "Workspace has a data source?"
      - id: "empty"
        type: "process"
        label: "Empty workspace: Connect a data source to see your dashboard"
        screen_ref: "SCR-005"
        state: "empty"
      - id: "connect"
        type: "input"
        label: "User selects Connect a data source"
      - id: "setup"
        type: "terminal"
        label: "Data source setup opens"
        state: "neutral"
      - id: "large"
        type: "decision"
        label: "Widget over 50,000 rows?"
      - id: "normal"
        type: "terminal"
        label: "Normal load (FLOW-001)"
        screen_ref: "SCR-002"
        state: "success"
      - id: "last30"
        type: "process"
        label: "Widget shows last 30 days + notice + Load full range"
        screen_ref: "SCR-004"
        state: "neutral"
      - id: "need_full"
        type: "decision"
        label: "User needs the full range?"
      - id: "keep30"
        type: "terminal"
        label: "User works with the last 30 days"
        screen_ref: "SCR-004"
        state: "success"
      - id: "load_full"
        type: "input"
        label: "User selects Load full range"
      - id: "progress"
        type: "process"
        label: "Progress shown inside the widget"
        screen_ref: "SCR-004"
        state: "loading"
      - id: "full_ok"
        type: "decision"
        label: "Full range loads within 60 s?"
      - id: "full_shown"
        type: "terminal"
        label: "Full range shown"
        screen_ref: "SCR-004"
        state: "success"
      - id: "to_flow_002"
        type: "subflow"
        label: "FLOW-002 Timeout state + Retry"
    edges:
      - from: "start"
        to: "has_source"
      - from: "has_source"
        to: "empty"
        condition: "No"
      - from: "empty"
        to: "connect"
      - from: "connect"
        to: "setup"
        style: "primary"
      - from: "has_source"
        to: "large"
        condition: "Yes"
        style: "primary"
      - from: "large"
        to: "normal"
        condition: "No"
        style: "primary"
      - from: "large"
        to: "last30"
        condition: "Yes"
      - from: "last30"
        to: "need_full"
      - from: "need_full"
        to: "keep30"
        condition: "No"
        style: "primary"
      - from: "need_full"
        to: "load_full"
        condition: "Yes"
      - from: "load_full"
        to: "progress"
      - from: "progress"
        to: "full_ok"
      - from: "full_ok"
        to: "full_shown"
        condition: "Yes"
        style: "primary"
      - from: "full_ok"
        to: "to_flow_002"
        condition: "No"
        style: "error"
